name: Render Free-Tier Keep-Alive

on:
  schedule:
    # Run every 14 minutes (Render spins down after 15 minutes of idle)
    - cron: '*/14 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API Health Endpoint URL'
        required: false
        default: 'https://travelmate-api.onrender.com/api/health'

jobs:
  ping:
    name: Ping API Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          URL="${{ secrets.RENDER_API_URL || github.event.inputs.target_url || 'https://travelmate-api.onrender.com/api/health' }}"
          echo "Pinging: $URL"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" --max-time 45 "$URL")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Keep-alive ping successful (Status: $STATUS)"
          else
            echo "⚠️ Health check returned status: $STATUS"
            exit 1
          fi
